
<script>
// ============================================
// COUNTDOWN SETTINGS
// ============================================
const START_DATE = "2026-10-21"; // Fixed baseline date
const END_DATE = "2030-06-20";   // Final workday
const TARGET_REMAINING_DAYS = 803;

const VACATION_WEEKS_PER_YEAR = 6;
const WORKDAYS_PER_WEEK = 5;
const VACATION_DAYS_PER_YEAR =
    VACATION_WEEKS_PER_YEAR * WORKDAYS_PER_WEEK;

// ============================================
// HOLIDAYS
// Dates are YYYY-MM-DD.
// This preserves your original holiday list.
// ============================================
const holidays = [
    "2026-01-01", "2026-02-16", "2026-04-03",
    "2026-05-18", "2026-07-01", "2026-08-03",
    "2026-09-07", "2026-09-30", "2026-10-12",
    "2026-11-11", "2026-12-25", "2026-12-28",

    "2027-01-01", "2027-02-15", "2027-03-26",
    "2027-05-24", "2027-07-01", "2027-08-02",
    "2027-09-06", "2027-09-30", "2027-10-11",
    "2027-11-11", "2027-12-27", "2027-12-28",

    "2028-01-03", "2028-02-21", "2028-04-14",
    "2028-05-22", "2028-07-03", "2028-08-07",
    "2028-09-04", "2028-09-30", "2028-10-09",
    "2028-11-13", "2028-12-25", "2028-12-26",

    "2029-01-01", "2029-02-19", "2029-03-30",
    "2029-05-21", "2029-07-02", "2029-08-06",
    "2029-09-03", "2029-10-01", "2029-10-08",
    "2029-11-12", "2029-12-25", "2029-12-26",

    "2030-01-01", "2030-02-18", "2030-04-19",
    "2030-05-20", "2030-07-01", "2030-08-05",
    "2030-09-02", "2030-09-30", "2030-10-14",
    "2030-11-11", "2030-12-25", "2030-12-26"
];

const holidaySet = new Set(holidays);

// ============================================
// DATE HELPERS
// Use local calendar dates to avoid UTC issues.
// ============================================
function formatLocalDate(date) {
    const y = date.getFullYear();
    const m = String(date.getMonth() + 1).padStart(2, "0");
    const d = String(date.getDate()).padStart(2, "0");

    return `${y}-${m}-${d}`;
}

function parseLocalDate(value) {
    const [y, m, d] = value.split("-").map(Number);
    return new Date(y, m - 1, d);
}

function addDays(date, days) {
    const result = new Date(date);
    result.setDate(result.getDate() + days);
    return result;
}

function isBusinessDay(date) {
    const day = date.getDay();

    return day !== 0 &&
           day !== 6 &&
           !holidaySet.has(formatLocalDate(date));
}

// ============================================
// COUNT BUSINESS DAYS, INCLUSIVE
// ============================================
function countBusinessDays(start, end) {
    if (start > end) return 0;

    let count = 0;
    const current = new Date(start);

    while (current <= end) {
        if (isBusinessDay(current)) {
            count++;
        }

        current.setDate(current.getDate() + 1);
    }

    return count;
}

function countWeekdays(start, end) {
    if (start > end) return 0;

    let count = 0;
    const current = new Date(start);

    while (current <= end) {
        const day = current.getDay();

        if (day !== 0 && day !== 6) {
            count++;
        }

        current.setDate(current.getDate() + 1);
    }

    return count;
}

// ============================================
// ANNUAL VACATION PRORATION
// Six weeks = 30 weekdays per calendar year.
// ============================================
function calculateVacation(start, end) {
    if (start > end) return 0;

    let total = 0;

    for (
        let year = start.getFullYear();
        year <= end.getFullYear();
        year++
    ) {
        const yearStart = parseLocalDate(`${year}-01-01`);
        const yearEnd = parseLocalDate(`${year}-12-31`);

        const segmentStart =
            start > yearStart ? start : yearStart;

        const segmentEnd =
            end < yearEnd ? end : yearEnd;

        total += VACATION_DAYS_PER_YEAR *
            countWeekdays(segmentStart, segmentEnd) /
            countWeekdays(yearStart, yearEnd);
    }

    return total;
}

// ============================================
// COUNT COMPLETED ELIGIBLE WORKDAYS
// ============================================
function countElapsedWorkdays(start, end) {
    if (start > end) return 0;

    const businessDays = countBusinessDays(start, end);
    const vacationDays = calculateVacation(start, end);

    return Math.max(
        0,
        Math.round(businessDays - vacationDays)
    );
}

function getLastBusinessDay(date) {
    const current = new Date(date);

    while (!isBusinessDay(current)) {
        current.setDate(current.getDate() - 1);
    }

    return current;
}

// ============================================
// SAFE PAGE UPDATES
// ============================================
function setText(id, value) {
    const element = document.getElementById(id);

    if (element) {
        element.textContent = value;
    }
}

// ============================================
// MAIN COUNTDOWN
// ============================================
function updateCountdown() {
    const today = parseLocalDate(
        formatLocalDate(new Date())
    );

    const startDate = parseLocalDate(START_DATE);
    const endDate = parseLocalDate(END_DATE);
    const yesterday = addDays(today, -1);

    // Count only workdays completed AFTER the fixed
    // baseline date. The baseline day itself is not
    // deducted from the starting 803.
    const elapsedEnd = yesterday < endDate
        ? yesterday
        : endDate;

    const elapsed = today <= startDate
        ? 0
        : countElapsedWorkdays(
            addDays(startDate, 1),
            elapsedEnd
        );

    // Never go below zero.
    const remaining = today > endDate
        ? 0
        : Math.max(
            0,
            TARGET_REMAINING_DAYS - elapsed
        );

    const percent = TARGET_REMAINING_DAYS > 0
        ? Math.min(
            100,
            Math.max(
                0,
                ((TARGET_REMAINING_DAYS - remaining) /
                 TARGET_REMAINING_DAYS) * 100
            )
        )
        : 100;

    // Total business days and prorated vacation
    // across the countdown period.
    const totalBusinessDays = countBusinessDays(
        startDate,
        endDate
    );

    const totalVacationDays = calculateVacation(
        startDate,
        endDate
    );

    // Update display.
    setText(
        "daysRemaining",
        remaining.toLocaleString()
    );

    setText(
        "percentComplete",
        percent.toFixed(1) + "% complete"
    );

    setText(
        "dateRange",
        `Period: ${START_DATE} to ${END_DATE}`
    );

    setText(
        "vacationInfo",
        `Vacation allowance: 6 weeks per year ` +
        `(${VACATION_DAYS_PER_YEAR} weekdays)`
    );

    setText(
        "holidayInfo",
        `Business days before vacation: ${totalBusinessDays}`
    );

    setText(
        "lastUpdated",
        "Last updated (business day): " +
        getLastBusinessDay(today).toDateString()
    );

    const progressBar =
        document.getElementById("progressBar");

    if (progressBar) {
        progressBar.style.width = percent + "%";
        progressBar.setAttribute(
            "aria-valuenow",
            percent.toFixed(1)
        );
    }
}

// Run when the HTML has loaded.
if (document.readyState === "loading") {
    document.addEventListener(
        "DOMContentLoaded",
        updateCountdown
    );
} else {
    updateCountdown();
}
</script>
